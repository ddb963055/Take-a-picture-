<style>
  :root{ --bg:#070D0A; --ink:#5CFF7A; --dim:#2C7A42; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;background:var(--bg);overflow:hidden;

    color:var(--ink);-webkit-font-smoothing:antialiased;touch-action:manipulation}
  canvas#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-52%);display:block;
    image-rendering:pixelated}
  video{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
  .title{position:fixed;left:calc(22px + env(safe-area-inset-left));top:calc(20px + env(safe-area-inset-top));pointer-events:none;line-height:1.6}
  .title b{display:block;font-weight:400;font-size:11px;letter-spacing:.32em}

  .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom));display:flex;gap:10px;
    opacity:0;pointer-events:none;transition:opacity .4s}
  .bar.on{opacity:1;pointer-events:auto}
  .pill{all:unset;cursor:pointer;white-space:nowrap;text-align:center;min-width:64px;border:1px solid var(--ink);border-radius:999px;padding:12px 22px;font-size:11px;letter-spacing:.24em;
    background:rgba(92,255,122,.04);transition:background .2s,transform .15s;-webkit-tap-highlight-color:transparent}
  .pill:hover{background:rgba(92,255,122,.14)} .pill:active{transform:scale(.96)}
  .pill.solid{background:var(--ink);color:var(--bg)}
  .pill[disabled]{opacity:.45;pointer-events:none}
  .msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));font-size:10px;letter-spacing:.2em;
    color:var(--dim);white-space:nowrap}
  @media (pointer:coarse){ .pill{padding:15px 22px} }

<body>
<canvas id="stage"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div class="msg" id="msg"></div>
<div class="bar" id="bar">
  <button class="pill" id="retake">重拍</button>
  <button class="pill" id="share" disabled>分享</button>
  <button class="pill solid" id="gif">下載 GIF</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/holistic.js" crossorigin="anonymous"></script>
<script>
(() => {
  // ---------- settings ----------
  let G = 96;                // pixel-game grid (cells across the square): 96, finer for groups and logos
  let HR = 480;              // line drawing resolution before snapping to the grid (5 px per cell)
  const M = 64, MM = 64;              // analysis grid for the person mask and the background
  const BOIL_FPS = 10;       // the finished doodle is redrawn this many times a second, each time a little different
  const BG_LEVELS = 2;       // how many light/dark boundaries of the scene become lines
  const MAX_BG_LINES = 12;   // keep only the longest background lines: a 5-year-old draws the big things
  const COUNT_FROM = 3;      // seconds of countdown before the snapshot
  const GIF_FRAMES = 10;     // frames in the downloaded GIF (one boil cycle each)
  const GREEN = [92, 255, 122], BG = [10, 20, 15], FLASH = [226, 255, 232], MID = [44, 150, 74];   // MID: the pixel frame
  const MIRROR_RESULT = false;   // false: the drawing reads like a real photo, so logos and text are the right way round (the live view stays mirrored)
  const CLOSED_EYE = 0.21;   // eyelid gap / eye width below this = eye closed
  const YOLO_URL = 'models/yolov8m-oiv7-fp16.onnx', ORT_URL = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
  // Open Images classes the doodle knows how to draw
  const KINDS = {7:'animal',17:'cake',28:'bird',33:'animal',49:'bird',69:'animal',78:'cake',82:'camera',84:'bird',96:'cat',99:'animal',108:'bird',152:'animal',154:'cake',160:'dog',162:'doll',163:'fish',174:'bird',176:'bird',179:'animal',184:'bird',192:'fish',206:'animal',215:'animal',221:'fish',225:'bird',235:'animal',239:'animal',244:'headphones',255:'animal',282:'cat',313:'cat',320:'bird',321:'animal',327:'animal',340:'animal',343:'animal',344:'cake',358:'bird',359:'animal',361:'bird',371:'bird',379:'bird',387:'animal',398:'animal',411:'animal',412:'animal',443:'animal',446:'fish',451:'fish',452:'animal',479:'bird',488:'animal',508:'bird',525:'doll',534:'cat',547:'doll',581:'fish',596:'bird',599:'animal'};
  const PARSE_URL = 'models/faceparse-fp16.onnx', FACE_CLS = 264, PN = 128;   // face parsing: 19 parts, read on a 128 grid
  const CANDLE = 85, MIN_SCORE = { doll: 0.15 }, ANIMALS = ['bird', 'dog', 'cat', 'fish', 'animal'];

  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d');
  const video = document.getElementById('cam');
  const bar = document.getElementById('bar'), msg = document.getElementById('msg');
  const work = document.createElement('canvas'); work.width = work.height = HR;
  const wctx = work.getContext('2d', { willReadFrequently: true });
  const cellsCv = document.createElement('canvas'); cellsCv.width = cellsCv.height = G;
  const cctx = cellsCv.getContext('2d'); let cellImg = cctx.createImageData(G, G);
  const camS = document.createElement('canvas'); camS.width = camS.height = M;
  const camCtx = camS.getContext('2d', { willReadFrequently: true });
  const viewS = document.createElement('canvas'); viewS.width = viewS.height = G;
  const viewCtx = viewS.getContext('2d', { willReadFrequently: true });
  const maskCv = document.createElement('canvas'); maskCv.width = maskCv.height = M;
  const mctx = maskCv.getContext('2d', { willReadFrequently: true });
  const still = document.createElement('canvas'); still.width = still.height = 640;     // the frozen moment, square
  const stillCtx = still.getContext('2d', { willReadFrequently: true });
  const stillM = document.createElement('canvas'); stillM.width = stillM.height = 640;   // the frozen moment as you see it (mirrored for selfies)
  const stillMCtx = stillM.getContext('2d', { willReadFrequently: true });
  const scan = document.createElement('canvas');

  let stream = null, facing = 'user', mode = 'idle', modeT = 0, lastBoil = 0, boilSeed = 1, labelDate = '', place = '';
  const labelText = () => (labelDate + ' ' + place).trim();
  const person = new Float32Array(M * M), bgLum = new Float32Array(M * M).fill(-1);
  let segReady = false, face = null, people = [], hands = [], phones = [], objects = [], mainParse = null, extraFaces = [], logoLines = [], strokesCache = [], hol = null, holReady = null, lastResult = null;

  // ---------- layout: a centred square ----------
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const S = Math.floor(Math.min(window.innerWidth * 0.88, window.innerHeight * 0.70));
    stage.style.width = stage.style.height = S + 'px';
    stage.width = stage.height = Math.round(S * dpr);
    scan.width = scan.height = stage.width;
    const sc = scan.getContext('2d'); sc.fillStyle = 'rgba(0,0,0,0.28)';
    const step = Math.max(2, Math.round(stage.width / G / 2.6));
    for (let y = 0; y < scan.height; y += step) sc.fillRect(0, y, scan.width, Math.max(1, step / 3));
    if (mode === 'result') { drawDoodle(); compose(); }
  }
  window.addEventListener('resize', resize);

  function crop(w, h) { const s = Math.min(w, h); return [(w - s) / 2, (h - s) / 2, s]; }

  // ---------- camera ----------
  async function startCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream; await video.play();
  }
  function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

  // ---------- the model runs once, on the frozen frame only ----------
  const U = p => [MIRROR_RESULT ? 1 - p.x : p.x, p.y];
  function initModel() {
    try {
      if (!window.Holistic) return;
      hol = new Holistic({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/${f}` });
      hol.setOptions({ modelComplexity: 1, smoothLandmarks: false, enableSegmentation: true, smoothSegmentation: false,
        refineFaceLandmarks: false, minDetectionConfidence: 0.4, minTrackingConfidence: 0.4 });
      hol.onResults(res => { lastResult = res; });
      holReady = hol.initialize ? hol.initialize().catch(() => {}) : Promise.resolve();   // download while you pose
      holReady.then(initYolo);
    } catch (e) { hol = null; }
  }
  initModel();
  // headphones: an Open Images detector, downloaded once in the background after the person model
  let yolo = null, yoloReady = null, parser = null, parseReady = null;
  function loadScript(src) { return new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.crossOrigin = 'anonymous'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
  function initYolo() {
    if (yoloReady) return;
    yoloReady = (async () => {
      await loadScript(ORT_URL + 'ort.min.js');
      ort.env.wasm.wasmPaths = ORT_URL; ort.env.wasm.numThreads = 1;
      yolo = await ort.InferenceSession.create(YOLO_URL, { executionProviders: ['wasm'] });
    })().catch(() => { yolo = null; });
    parseReady = yoloReady.then(async () => { if (window.ort) parser = await ort.InferenceSession.create(PARSE_URL, { executionProviders: ['wasm'] }); }).catch(() => { parser = null; });
  }
  async function detectObjects() {
    const S = 640, yc = document.createElement('canvas'); yc.width = yc.height = S;
    const yx = yc.getContext('2d', { willReadFrequently: true }); yx.drawImage(still, 0, 0, S, S);
    const d = yx.getImageData(0, 0, S, S).data, inp = new Float32Array(3 * S * S), A = S * S;
    for (let i = 0, p = 0; i < A; i++, p += 4) { inp[i] = d[p] / 255; inp[A + i] = d[p + 1] / 255; inp[2 * A + i] = d[p + 2] / 255; }
    const res = await yolo.run({ images: new ort.Tensor('float32', inp, [1, 3, S, S]) });
    const o = res[yolo.outputNames[0]].data, N = 8400, cand = [], candles = [], faceCand = [];
    const box = i => { const cx = o[i] / S, cy = o[N + i] / S, w = o[2 * N + i] / S, h = o[3 * N + i] / S;
      const b = [cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2]; return MIRROR_RESULT ? [1 - b[2], b[1], 1 - b[0], b[3]] : b; };
    const cls = Object.keys(KINDS).map(Number);
    for (let i = 0; i < N; i++) {
      let best = 0, bk = null;
      for (const c of cls) { const sc = o[(4 + c) * N + i]; if (sc > best) { best = sc; bk = KINDS[c]; } }
      if (bk && best >= (MIN_SCORE[bk] || 0.25)) { const b = box(i); b.score = best; b.kind = bk; cand.push(b); }
      const cs = o[(4 + CANDLE) * N + i]; if (cs >= 0.4) { const b = box(i); b.score = cs; candles.push(b); }
      const fs = o[(4 + FACE_CLS) * N + i]; if (fs >= 0.3) { const b = box(i); b.score = fs; b.kind = 'face'; faceCand.push(b); }
    }
    cand.sort((a, b) => b.score - a.score);
    const overlap = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
    let keep = [];
    for (const b of cand) if (keep.every(k => !overlap(k, b) || (k.kind !== b.kind && !ANIMALS.includes(k.kind) && !ANIMALS.includes(b.kind)))) keep.push(b);
    // a lit candle almost always sits on a cake
    if (!keep.some(k => k.kind === 'cake') && candles.length) {
      const c = candles.sort((a, b) => b.score - a.score)[0], cx = (c[0] + c[2]) / 2, w = (c[2] - c[0]) * 2.4;
      const b = [cx - w / 2, c[1], cx + w / 2, Math.min(1, c[3] + (c[3] - c[1]) * 0.9)]; b.kind = 'cake'; b.score = c.score; keep.push(b);
    }
    // crowds of animals: only the 8 biggest, nothing tiny
    const area = b => (b[2] - b[0]) * (b[3] - b[1]);
    const ani = keep.filter(k => ANIMALS.includes(k.kind) && Math.min(k[2] - k[0], k[3] - k[1]) >= 0.052).sort((a, b) => area(b) - area(a)).slice(0, 8);
    keep = keep.filter(k => !ANIMALS.includes(k.kind)).concat(ani);
    // people's faces (for everyone after the first): non-max suppression
    faceCand.sort((a, b) => b.score - a.score);
    const iou = (a, b) => { const iw = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])), ih = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1])), I = iw * ih; return I / (area(a) + area(b) - I); };
    const fk = []; for (const b of faceCand) if (fk.every(k => iou(k, b) < 0.3)) fk.push(b);
    return keep.slice(0, 12).concat(fk.slice(0, 8));
  }

  // ---------- face parsing: hair, hat, glasses, earrings, necklace (and whole faces for everyone else in a group) ----------
  const PC = { skin: 1, lbrow: 2, rbrow: 3, leye: 4, reye: 5, glasses: 6, lear: 7, rear: 8, earring: 9, nose: 10, mouth: 11, ulip: 12, llip: 13, neck: 14, necklace: 15, cloth: 16, hair: 17, hat: 18 };
  async function parseFace(fb, roll = 0) {
    const w = fb[2] - fb[0], h = fb[3] - fb[1], cx = (fb[0] + fb[2]) / 2, cy = (fb[1] + fb[3]) / 2, sz = Math.max(w, h) * 2.1;
    const crop = [cx - sz / 2, cy - sz * 0.55, cx + sz / 2, cy + sz * 0.45], S = 512, W0 = stillM.width;
    const pc = document.createElement('canvas'); pc.width = pc.height = S; const px = pc.getContext('2d', { willReadFrequently: true });
    px.fillStyle = '#808080'; px.fillRect(0, 0, S, S);
    // a tilted head is turned upright first (the parser is much better on upright faces)
    px.save(); px.scale(S / (sz * W0), S / (sz * W0)); px.translate(-crop[0] * W0, -crop[1] * W0);
    px.translate(cx * W0, cy * W0); px.rotate(-roll); px.translate(-cx * W0, -cy * W0);
    px.drawImage(stillM, 0, 0); px.restore();
    const d = px.getImageData(0, 0, S, S).data, A = S * S, inp = new Float32Array(3 * A), MEAN = [0.485, 0.456, 0.406], STD = [0.229, 0.224, 0.225];
    for (let i = 0, p = 0; i < A; i++, p += 4) for (let c = 0; c < 3; c++) inp[c * A + i] = (d[p + c] / 255 - MEAN[c]) / STD[c];
    const res = await parser.run({ [parser.inputNames[0]]: new ort.Tensor('float32', inp, [1, 3, S, S]) });
    const o = res[parser.outputNames[0]].data, L = new Uint8Array(PN * PN), st = S / PN;
    for (let gy = 0; gy < PN; gy++) for (let gx = 0; gx < PN; gx++) {
      const q = (gy * st + st / 2 | 0) * S + (gx * st + st / 2 | 0); let best = -1e9, bc = 0;
      for (let c = 0; c < 19; c++) { const v = o[c * A + q]; if (v > best) { best = v; bc = c; } }
      L[gy * PN + gx] = bc;
    }
    return { L, crop, fb, roll, rc: [cx, cy] };
  }
  const pPt = (P, gx, gy) => { const x = P.crop[0] + (gx + 0.5) / PN * (P.crop[2] - P.crop[0]) - P.rc[0], y = P.crop[1] + (gy + 0.5) / PN * (P.crop[3] - P.crop[1]) - P.rc[1];
    const co = Math.cos(P.roll), si = Math.sin(P.roll); return [P.rc[0] + x * co - y * si, P.rc[1] + x * si + y * co]; };
  const lmRoll = lm => { let a = Math.atan2(lm[263][1] - lm[33][1], lm[263][0] - lm[33][0]); if (a > Math.PI / 2) a -= Math.PI; if (a < -Math.PI / 2) a += Math.PI; return Math.abs(a) < 0.12 ? 0 : a; };
  const pMask = (P, ...cls) => { const m = new Uint8Array(PN * PN); for (let i = 0; i < PN * PN; i++) m[i] = cls.includes(P.L[i]) ? 1 : 0; return m; };
  function pComps(P, minArea, ...cls) {                                    // outlines of each part, in picture coordinates
    return traceOutlines(pMask(P, ...cls), minArea, PN).map(o => ({ area: o.area, grid: o.pts, pts: o.pts.map(([x, y]) => pPt(P, x, y)) }));
  }
  function pSegments(P, minArea, ...cls) {                                 // open lines: the crop edge is not a real edge
    const out = [];
    for (const c of pComps(P, minArea, ...cls)) {
      let cur = [];
      c.grid.forEach(([gx, gy], j) => { const q = c.pts[j];
        const edge = gx <= 1 || gy <= 1 || gx >= PN - 2 || gy >= PN - 2 || q[0] < 0.01 || q[1] < 0.01 || q[0] > 0.99 || q[1] > 0.99;
        if (edge) { if (cur.length > 4) out.push(cur); cur = []; } else cur.push(q); });
      if (cur.length > 4) out.push(cur);
    }
    return out;
  }
  const centre = pts => [pts.reduce((a, q) => a + q[0], 0) / pts.length, pts.reduce((a, q) => a + q[1], 0) / pts.length];
  // what the face parse adds around a face: hair, hat, glasses, earrings, necklace
  function parsedExtras(P, T, r, eyes) {
    const out = [], cell = (P.crop[2] - P.crop[0]) / PN;
    for (const seg of pSegments(P, 30, PC.hair)) out.push({ pts: simplify(seg, r * 0.07).map(T), w: 1.0 });
    // a few wavy strands inside the hair, kid style
    const hm = pMask(P, PC.hair), inHair = (x, y) => x >= 0 && y >= 0 && x < PN && y < PN && hm[y * PN + x];
    const fcx = (P.fb[0] + P.fb[2]) / 2, fcy = (P.fb[1] + P.fb[3]) / 2, cand = [];
    for (let y = 3; y < PN - 3; y += 3) for (let x = 3; x < PN - 3; x += 3) if (inHair(x, y) && inHair(x - 3, y) && inHair(x + 3, y) && inHair(x, y - 3) && inHair(x, y + 3)) cand.push([x, y]);
    for (let k = 0; k < 3 && cand.length > 20 && r > 0.06; k++) {

        const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
        const j = await r.json(); const city = (j.city || j.locality || '').replace(/ City$/, '');
        if (city) { place = city; try { localStorage.setItem('doodlecam-place', city); } catch (e) {} }
      } catch (e) {}
    }, () => {}, { timeout: 15000, maximumAge: 3600000 });
  }
  detectPlace();

  resize();
  requestAnimationFrame(frame);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg.textContent = '請用 Chrome 或 Safari 開啟（手機需 https 網址）'; }
  else begin();
})();
</script>
</body>
</html>
