<body>
<canvas id="stage"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div class="title"><b>AFTERIMAGE</b><span>doodle snapshot — study 09</span></div>
<div class="msg" id="msg"></div>
<div class="bar" id="bar">
  <button class="pill" id="retake">重拍</button>
  <button class="pill solid" id="gif">下載 GIF</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/holistic.js" crossorigin="anonymous"></script>
<script>
(() => {
  // ---------- settings ----------
  const G = 96;              // pixel-game grid (cells across the square)
  const HR = 480;            // line drawing resolution before snapping to the grid (5 px per cell)
  const M = 64;              // analysis grid for the person mask and the background
  const BOIL_FPS = 10;       // the finished doodle is redrawn this many times a second, each time a little different
  const BG_LEVELS = 2;       // how many light/dark boundaries of the scene become lines
  const MAX_BG_LINES = 12;   // keep only the longest background lines: a 5-year-old draws the big things
  const COUNT_FROM = 3;      // seconds of countdown before the snapshot
  const GIF_FRAMES = 10;     // frames in the downloaded GIF (one boil cycle each)
  const GREEN = [92, 255, 122], BG = [10, 20, 15], FLASH = [226, 255, 232];

  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d');
  const video = document.getElementById('cam');
  const bar = document.getElementById('bar'), msg = document.getElementById('msg');
  const work = document.createElement('canvas'); work.width = work.height = HR;
  const wctx = work.getContext('2d', { willReadFrequently: true });
  const cellsCv = document.createElement('canvas'); cellsCv.width = cellsCv.height = G;
  const cctx = cellsCv.getContext('2d'); const cellImg = cctx.createImageData(G, G);
  const camS = document.createElement('canvas'); camS.width = camS.height = M;
  const camCtx = camS.getContext('2d', { willReadFrequently: true });
  const viewS = document.createElement('canvas'); viewS.width = viewS.height = G;
  const viewCtx = viewS.getContext('2d', { willReadFrequently: true });
  const maskCv = document.createElement('canvas'); maskCv.width = maskCv.height = M;
  const mctx = maskCv.getContext('2d', { willReadFrequently: true });
  const still = document.createElement('canvas'); still.width = still.height = 384;     // the frozen moment, square
  const stillCtx = still.getContext('2d', { willReadFrequently: true });
  const scan = document.createElement('canvas');

  let stream = null, facing = 'user', mode = 'idle', modeT = 0, lastBoil = 0, boilSeed = 1, label = '';
  const person = new Float32Array(M * M), bgLum = new Float32Array(M * M).fill(-1);
  let segReady = false, face = null, hands = [], strokesCache = [], hol = null, holReady = null, lastResult = null;

  // ---------- layout: a centred square ----------
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const S = Math.floor(Math.min(window.innerWidth * 0.88, window.innerHeight * 0.70));
    stage.style.width = stage.style.height = S + 'px';
    stage.width = stage.height = Math.round(S * dpr);
    scan.width = scan.height = stage.width;
    const sc = scan.getContext('2d'); sc.fillStyle = 'rgba(0,0,0,0.28)';
    const step = Math.max(2, Math.round(stage.width / G / 2.6));
    for (let y = 0; y < scan.height; y += step) sc.fillRect(0, y, scan.width, Math.max(1, step / 3));
    if (mode === 'result') { drawDoodle(); compose(); }
  }
  window.addEventListener('resize', resize);

  function crop(w, h) { const s = Math.min(w, h); return [(w - s) / 2, (h - s) / 2, s]; }

  // ---------- camera ----------
  async function startCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream; await video.play();
  }
  function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

  // ---------- the model runs once, on the frozen frame only ----------
  const U = p => [facing === 'user' ? 1 - p.x : p.x, p.y];
  function initModel() {
    try {
      if (!window.Holistic) return;
      hol = new Holistic({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/${f}` });
      hol.setOptions({ modelComplexity: 1, smoothLandmarks: false, enableSegmentation: true, smoothSegmentation: false,
        refineFaceLandmarks: false, minDetectionConfidence: 0.4, minTrackingConfidence: 0.4 });
      hol.onResults(res => { lastResult = res; });
      holReady = hol.initialize ? hol.initialize().catch(() => {}) : Promise.resolve();   // download while you pose
    } catch (e) { hol = null; }
  }
  initModel();
  function applyResult(res) {
    const m = res.segmentationMask;
    segReady = false; person.fill(0);
    if (m) {
      mctx.save(); mctx.clearRect(0, 0, M, M);
      if (facing === 'user') { mctx.translate(M, 0); mctx.scale(-1, 1); }
      mctx.drawImage(m, 0, 0, m.width, m.height, 0, 0, M, M); mctx.restore();
      const d = mctx.getImageData(0, 0, M, M).data;
      for (let i = 0, p = 0; i < M * M; i++, p += 4) person[i] = Math.min(d[p + 3], Math.max(d[p], d[p + 1], d[p + 2])) / 255;
      segReady = true;
    }
    face = res.faceLandmarks ? res.faceLandmarks.map(U) : null;
    hands = [res.leftHandLandmarks, res.rightHandLandmarks].filter(Boolean).map(h => h.map(U));
  }

  // background brightness of the frozen frame
  function sampleStill() {
    camCtx.save(); if (facing === 'user') { camCtx.translate(M, 0); camCtx.scale(-1, 1); }
    camCtx.drawImage(still, 0, 0, M, M); camCtx.restore();
    const d = camCtx.getImageData(0, 0, M, M).data;
    for (let i = 0, p = 0; i < M * M; i++, p += 4) bgLum[i] = d[p] * 0.299 + d[p + 1] * 0.587 + d[p + 2] * 0.114;
  }

  // ---------- contour tracing on a binary grid ----------
  function traceOutlines(bin, minArea) {
    const lab = new Int32Array(M * M), out = []; let id = 0;
    const DX = [1, 1, 0, -1, -1, -1, 0, 1], DY = [0, 1, 1, 1, 0, -1, -1, -1];
    const at = (x, y) => x >= 0 && y >= 0 && x < M && y < M && bin[y * M + x];
    for (let s0 = 0; s0 < M * M; s0++) {
      if (!bin[s0] || lab[s0]) continue;
      id++; let area = 0; const st = [s0]; lab[s0] = id;
      while (st.length) { const c = st.pop(); area++; const x = c % M, y = (c / M) | 0;
        for (let k = 0; k < 8; k += 2) { const nx = x + DX[k], ny = y + DY[k], ni = ny * M + nx;
          if (at(nx, ny) && !lab[ni]) { lab[ni] = id; st.push(ni); } } }
      if (area < minArea) continue;
      // Moore-neighbour boundary walk from the component's first (top-left) cell
      const sx = s0 % M, sy = (s0 / M) | 0; let x = sx, y = sy, dir = 6; const pts = [[x, y]];
      for (let guard = 0; guard < 4 * M * M; guard++) {
        let found = false;
        for (let k = 0; k < 8; k++) { const nd = (dir + 6 + k) % 8, nx = x + DX[nd], ny = y + DY[nd];
          if (at(nx, ny) && lab[ny * M + nx] === id) { x = nx; y = ny; dir = nd; found = true; break; } }
        if (!found || (x === sx && y === sy)) break;
        pts.push([x, y]);
      }
      out.push({ pts, area });
    }
    return out;
  }
  // Ramer–Douglas–Peucker: fewer points = a simpler, more childlike shape
  function simplify(p, eps) {
    if (p.length < 3) return p;
    let dmax = 0, idx = 0; const [a, b] = [p[0], p[p.length - 1]];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    for (let i = 1; i < p.length - 1; i++) {
      const d = Math.abs((b[1] - a[1]) * p[i][0] - (b[0] - a[0]) * p[i][1] + b[0] * a[1] - b[1] * a[0]) / L;
      if (d > dmax) { dmax = d; idx = i; }
    }
    if (dmax <= eps) return [a, b];
    return simplify(p.slice(0, idx + 1), eps).slice(0, -1).concat(simplify(p.slice(idx), eps));
  }
  // closed outlines: split at the point farthest from the start, simplify both halves
  function simplifyClosed(p, eps) {
    let far = 0, fd = -1;
    for (let i = 1; i < p.length; i++) { const d = Math.hypot(p[i][0] - p[0][0], p[i][1] - p[0][1]); if (d > fd) { fd = d; far = i; } }
    if (far === 0) return p;
    return simplify(p.slice(0, far + 1), eps).slice(0, -1).concat(simplify(p.slice(far).concat([p[0]]), eps));
  }
  const toU = p => [(p[0] + 0.5) / M, (p[1] + 0.5) / M];

  // ---------- build the childlike drawing as a list of strokes (0..1 coords) ----------
  function buildStrokes() {
    const strokes = [];
    // dilated person mask, used to stop background lines at the person
    const near = new Uint8Array(M * M);
    for (let y = 0; y < M; y++) for (let x = 0; x < M; x++) {
      let m = 0; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < M && Y < M && person[Y * M + X] > 0.4) m = 1; }
      near[y * M + x] = segReady ? m : 0;
    }
    // background: boundaries between a few brightness levels (mountains, horizon, clouds, door frames...)
    if (bgLum[0] >= 0) {
      const sm = new Float32Array(M * M);
      for (let y = 0; y < M; y++) for (let x = 0; x < M; x++) { let s = 0, c = 0;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < M && Y < M) { s += bgLum[Y * M + X]; c++; } }
        sm[y * M + x] = s / c; }
      const vals = []; for (let i = 0; i < M * M; i++) if (!near[i]) vals.push(sm[i]);
      vals.sort((a, b) => a - b);
      const bgLines = [];
      for (let k = 1; k <= BG_LEVELS && vals.length > 50; k++) {
        const t = vals[Math.floor(vals.length * k / (BG_LEVELS + 1))];
        const bin = new Uint8Array(M * M); for (let i = 0; i < M * M; i++) bin[i] = sm[i] > t ? 1 : 0;
        for (const o of traceOutlines(bin, 25)) {
          // split at the frame edge and at the person: open lines, like a hand-drawn horizon
          let cur = [];
          for (const p of o.pts) {
            const edge = p[0] <= 0 || p[1] <= 0 || p[0] >= M - 1 || p[1] >= M - 1, blocked = near[p[1] * M + p[0]];
            if (edge || blocked) { if (cur.length > 6) bgLines.push(cur); cur = []; } else cur.push(p);
          }
          if (cur.length > 6) bgLines.push(cur);
        }
      }
      bgLines.sort((a, b) => b.length - a.length);
      for (const l of bgLines.slice(0, MAX_BG_LINES)) strokes.push({ pts: simplify(l, 1.6).map(toU), w: 1.0 });
    }
    // regions where a detailed doodle replaces the silhouette outline: the face and each hand
    const holes = [];
    let faceStrokes = [], handStrokes = [], stickerStrokes = [], faceInfo = null;
    if (face) {
      // a small face is enlarged around its centre (kids draw big heads), so the features stay readable
      const c0 = centroid(FACE_OVAL.map(i => face[i]));
      const r0 = FACE_OVAL.reduce((s, i) => s + Math.hypot(face[i][0] - c0[0], face[i][1] - c0[1]), 0) / FACE_OVAL.length;
      const k = Math.min(2.0, Math.max(1, 0.13 / r0));
      const F = face.map(p => [c0[0] + (p[0] - c0[0]) * k, c0[1] + (p[1] - c0[1]) * k]);
      const face_ = F, pick = idx => idx.map(i => F[i]);
      const oval = pick(FACE_OVAL), c = c0, r = r0 * k;
      holes.push([c, r * 1.12]);
      // head: the real face outline, simplified to a lumpy childlike shape
      faceStrokes.push({ pts: closeLoop(simplifyClosed(oval, r * 0.09)), w: 1.15 });
      const fw = r * 2, eyeOpen = [];
      // eyes: size and openness come from the eyelids; closed eyes become a short line
      for (const [up, low, corners] of EYES) {
        const a = F[corners[0]], b = F[corners[1]], w = Math.hypot(a[0] - b[0], a[1] - b[1]);
        const open = Math.hypot(F[up][0] - F[low][0], F[up][1] - F[low][1]) / (w || 1);
        const ec = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; eyeOpen.push(open);
        if (open < 0.16) faceStrokes.push({ pts: [a, b], w: 0.75 });
        else faceStrokes.push({ dot: ec, r: Math.max(fw * 0.035, w * (0.16 + open * 0.35)) });
      }
      // brows: five points each, reduced to a three-point line that follows the expression
      for (const br of BROWS) faceStrokes.push({ pts: simplify(pick(br), r * 0.03).slice(0, 3).length >= 2 ? [F[br[0]], F[br[2]], F[br[4]]] : pick(br), w: 0.8 });
      // nose: bridge -> tip -> the nostril on the side the face is turned to
      const tip = F[4], bridge = F[6], side = (F[98][0] - tip[0]) ** 2 > (F[327][0] - tip[0]) ** 2 ? F[98] : F[327];
      faceStrokes.push({ pts: [[(bridge[0] * 2 + tip[0]) / 3, (bridge[1] * 2 + tip[1]) / 3], tip, side], w: 0.8 });
      // mouth: the real lip line; an open mouth becomes a simplified open shape
      const mw = Math.hypot(F[61][0] - F[291][0], F[61][1] - F[291][1]);
      const gap = Math.hypot(F[13][0] - F[14][0], F[13][1] - F[14][1]) / (mw || 1);
      if (gap > 0.18) faceStrokes.push({ pts: closeLoop(simplifyClosed(pick(LIPS_INNER), mw * 0.08)), w: 0.95 });
      else faceStrokes.push({ pts: simplify(pick(MOUTH_LINE), mw * 0.05), w: 0.95 });
      // expression stickers: big open mouth -> WOW!, smile -> heart, both eyes shut -> Zzz
      const smile = ((F[13][1] + F[14][1]) / 2 - (F[61][1] + F[291][1]) / 2) / (mw || 1);
      faceInfo = { c, r };
      if (gap > 0.3) stickerStrokes.push(...stickerWow(c, r));
      else if (eyeOpen.length === 2 && eyeOpen[0] < 0.17 && eyeOpen[1] < 0.17) stickerStrokes.push(...stickerZzz(c, r));
      if (smile > 0.1 && mw / fw > 0.36 && gap <= 0.3) stickerStrokes.push(...stickerHeart(c, r));
      // ears: a little bump just outside each side of the face
      for (const [ei, dir] of [[234, -1], [454, 1]]) {
        const e = F[ei], out = [e[0] - c[0], e[1] - c[1]], L = Math.hypot(out[0], out[1]) || 1;
        const ex = e[0] + out[0] / L * r * 0.12, ey = e[1] + out[1] / L * r * 0.12;
        const a0 = Math.atan2(out[1], out[0]) * 180 / Math.PI;
        faceStrokes.push({ pts: arc(ex, ey, r * 0.16, a0 - 80, a0 + 80, 8), w: 0.8 });
      }
    }
    for (const h0 of hands) {
      const xs = h0.map(p => p[0]), ys = h0.map(p => p[1]);
      const hc = [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
      const hr0 = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) * 0.62;
      const kh = Math.min(1.8, Math.max(1, 0.08 / hr0)), hr = hr0 * kh;                 // small hands are enlarged too
      const h = h0.map(p => [hc[0] + (p[0] - hc[0]) * kh, hc[1] + (p[1] - hc[1]) * kh]);
      holes.push([hc, hr]);
      // palm: wrist and finger bases, simplified
      const palm = [0, 1, 5, 9, 13, 17].map(i => h[i]);
      handStrokes.push({ pts: closeLoop(simplifyClosed(palm, hr * 0.08)), w: 1.0 });

        else { let nb = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const X = gx + dx, Y = gy + dy; if (X >= 0 && Y >= 0 && X < G && Y < G && on[Y * G + X]) nb = 1; } c = nb ? 2 : 0; }
        const q = (y * W + x) * 4;
        if (ld[q + 3] > 60) c = ld[q + 1] > ld[q] ? 4 : 0;                // caption plate + text
        if (y % 3 === 1) c += 1;                                            // scanline
        idx[y * W + x] = c;
      }
      frames.push(idx);
    }
    boilSeed = seed0;
    const blob = encodeGif(W, W, frames, palette, Math.round(100 / BOIL_FPS));
    await saveBlob(blob, `afterimage-doodle-${stamp()}.gif`);
    btn.disabled = false; btn.textContent = '下載 GIF';
  }

  // ---------- save ----------
  const stamp = () => { const t = new Date(), z = n => String(n).padStart(2, '0');
    return `${t.getFullYear()}${z(t.getMonth() + 1)}${z(t.getDate())}-${z(t.getHours())}${z(t.getMinutes())}${z(t.getSeconds())}`; };
  async function saveBlob(blob, name) {
    const file = new File([blob], name, { type: blob.type });
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  document.getElementById('retake').addEventListener('click', begin);
  document.getElementById('gif').addEventListener('click', makeGif);

  resize();
  requestAnimationFrame(frame);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg.textContent = '請用 Chrome 或 Safari 開啟（手機需 https 網址）'; }
  else begin();
})();
</script>
</body>
